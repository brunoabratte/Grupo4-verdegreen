spring.application.name=verdegreen

server.port=8081
# MySQL datasource
# Valores predeterminados para XAMPP / Laragon
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/verdegreen}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Datos para pagos por transferencia
app.transferencia.alias=verdegreen.reciclados
app.transferencia.cbu=0000000000000000000000
app.transferencia.titular=Reciclados VerdeGreen
app.transferencia.whatsapp=+54 9 2302 000000